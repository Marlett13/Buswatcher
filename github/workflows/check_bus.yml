name: Check bus and notify

on:
  schedule:
    # Все времена в UTC! Новосибирск = UTC+7, зимнего/летнего времени в России нет.
    #
    # Утреннее окно (с запасом вокруг active_hours "05:30-09:00" в config.yaml)
    # — 22:00-02:59 UTC = 05:00-09:59 по Новосибирску.
    - cron: "*/5 22-23,0-2 * * *"
    # Вечернее окно (с запасом вокруг active_hours "17:00-20:30")
    # — 09:30-13:59 UTC = 16:30-20:59 по Новосибирску.
    - cron: "*/5 10-13 * * *"
    - cron: "30-59/5 9 * * *"
  workflow_dispatch: {}  # позволяет запустить вручную кнопкой "Run workflow" на GitHub

# Без этого экшен не сможет закоммитить обновлённый state.json обратно в репозиторий.
permissions:
  contents: write

concurrency:
  group: check-bus
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notifier.py

      - name: Commit updated state.json (if changed)
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "bus-notifier-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update notification state [skip ci]"
            git push
          else
            echo "state.json без изменений — коммитить нечего."
          fi
