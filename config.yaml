# Настройки слежения за автобусами.
# Этот файл можно спокойно хранить в публичном репозитории — здесь нет секретов
# (токен бота и chat_id задаются отдельно, см. README.md).
#
# ВАЖНО: stop_id ниже я подобрал через веб-поиск и разбор карточек Яндекс.Карт
# (у меня в этой сессии нет прямого доступа к API Яндекса, чтобы проверить
# результат вживую). Прежде чем доверять уведомлениям — обязательно прогони
# каждый watch с флагом --debug (см. README, раздел "Проверка перед тем как
# доверять") и сверь, что показанные маршруты и направления совпадают с тем,
# что ты видишь на остановке в жизни.

telegram:
  # Не обязательно заполнять здесь — можно (и лучше) передать через переменные
  # окружения TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (см. README).
  bot_token: ""
  chat_id: ""

watches:
  - name: "Утро — Марусино → Площадь Маркса"
    # Остановка "Марусино" (50Н-2120). Подтверждено: автобус 114 отсюда идёт
    # именно "→ Метро Площадь Маркса" (расписание видел разреженное, около
    # 06:16 и 08:11 — то есть реально раз в 1.5-2 часа, здесь уведомление
    # особенно ценно).
    stop_id: 10051199
    # 114 — подтверждён (идёт до Площади Маркса).
    # 220 — ты его назвал, но по данным 2ГИС с этой же остановки 220 идёт
    #   в сторону "Центральный корпус", а не к Площади Маркса. Возможно,
    #   это то, что тебе и нужно (если едешь иногда другим путём) — но если
    #   нет, лучше убрать "220" из списка, чтобы не получать уведомления
    #   про автобус не в ту сторону.
    routes: ["114", "220"]
    notify_before_minutes: 10
    active_hours: "05:30-09:00"
    active_weekdays: "mon-fri"

  - name: "Вечер — Сад Дзержинского → Берёзовая роща/Пл.Маркса"
    # Остановка "Сад им. Дзержинского" на просп. Дзержинского. На ней
    # подтверждены маршруты 6, 10 (троллейбус), 113, 203, 399, 30, 42, 44,
    # 44а, 72, а также троллейбус 23 — но 23 на этой стороне остановки
    # Яндекс пометил как "только высадка" (посадки может не быть). Если
    # окажется, что 23 у тебя не отслеживается или не даёт сесть — либо
    # убери его из списка, либо понадобится stop_id остановки на другой
    # стороне проспекта (там, где 23 именно подбирает пассажиров).
    stop_id: 9981965
    routes: ["10", "23", "6"]
    notify_before_minutes: 7
    active_hours: "17:00-20:00"
    active_weekdays: "mon-fri"

  - name: "Вечер — Площадь Маркса → Марусино"
    # Автобус 114 в обратную сторону (от Площади Маркса на Марусино).
    # На площади Маркса несколько разных физических остановок-кластеров;
    # эта — та, где в списке маршрутов встретился 114, но конкретно
    # направление "→ Марусино" в спарсенных данных не подтвердилось на
    # 100% — ОБЯЗАТЕЛЬНО проверь через --debug перед тем как полагаться.
    stop_id: 9981615
    routes: ["114"]
    notify_before_minutes: 10
    active_hours: "17:00-20:30"
    active_weekdays: "mon-fri"

# Часовой пояс, в котором заданы active_hours (IANA-имя).
timezone: "Asia/Novosibirsk"

# Сколько минут держать "запись об уведомлении" в state.json, чтобы не спамить
# повторно про тот же самый автобус на каждом прогоне.
dedup_window_minutes: 90
