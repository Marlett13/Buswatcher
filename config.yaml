# Настройки напоминаний об автобусе 114 (Марусино <-> Площадь Маркса).
#
# ВАЖНО: это НЕ живое отслеживание автобуса, а напоминание по известному
# расписанию (см. README — почему пришлось отказаться от "живых" данных
# Яндекса). Расписание ниже собрано из открытых источников и сверено по
# двум независимым сайтам, но всё равно стоит свериться с реальным
# расписанием на остановке хотя бы один раз, вдруг что-то поменялось.

telegram:
  # Не обязательно заполнять здесь — можно (и лучше) передать через переменные
  # окружения TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (см. README).
  bot_token: ""
  chat_id: ""

watches:
  - name: "Утро — Марусино → Площадь Маркса (автобус 114)"
    departures:
      - "06:15"
      - "08:10"
      - "10:15"
      - "12:40"
      - "14:25"
      - "16:00"
      - "19:30"
      - "21:05"
    notify_before_minutes: 10
    active_weekdays: "mon-fri"

  - name: "Вечер — Площадь Маркса → Марусино (автобус 114)"
    departures:
      - "07:05"
      - "09:10"
      - "11:05"
      - "13:30"
      - "15:15"
      - "18:35"
      - "20:20"
    notify_before_minutes: 10
    active_weekdays: "mon-fri"

# Часовой пояс (IANA-имя).
timezone: "Asia/Novosibirsk"

# Сколько минут держать "запись об уведомлении" в state.json, чтобы не
# спамить повторно про тот же самый рейс. 600 минут = 10 часов — с запасом
# больше, чем разница между самыми близкими рейсами в расписании выше.
dedup_window_minutes: 600
